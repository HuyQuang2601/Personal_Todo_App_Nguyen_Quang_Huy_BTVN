<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{owner.pageTitle}">Owner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
        }

        .locale-switch {
            margin-bottom: 14px;
            text-align: right;
        }

        .locale-switch a {
            margin-left: 8px;
        }

        .message {
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fff8e1;
            color: #8d6e63;
        }

        form {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
        }

        input, button {
            padding: 6px 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="locale-switch">
        <a th:href="@{/todos(lang='vi')}" th:text="#{language.vi}">Tiếng Việt</a>
        <a th:href="@{/todos(lang='en')}" th:text="#{language.en}">English</a>
    </div>

    <h1 th:text="#{owner.heading}">Nhập chủ sở hữu</h1>
    <p th:text="#{owner.instruction}">Vui lòng nhập tên trước khi dùng danh sách.</p>

    <div class="message" th:if="${messageKey}" th:text="#{${messageKey}}"></div>

    <form th:action="@{/todos/owner}" method="post">
        <label for="ownerName" th:text="#{owner.label}">Chủ sở hữu</label>
        <input id="ownerName" name="ownerName" type="text" th:placeholder="#{owner.placeholder}">
        <button type="submit" th:text="#{owner.button.start}">Bắt đầu</button>
    </form>
</div>
</body>
</html>
